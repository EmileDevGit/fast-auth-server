services:
  db:
    image: postgres:18-alpine
    container_name: "postgres"
    restart: always
    env_file: ".env"
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql
      - ./src/initdb/init-db.sql:/docker-entrypoint-initdb.d/create_tables.sql

  app:
    image: fast-auth:dev
    container_name: "fast-auth-dev"
    build:
      context: .
      target: dev
    env_file: ".env"
    develop:
      watch:
        - action: sync
          path: ./src/app
          target: /src/app
          ignore: 
            - __pycache__
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./requirements/
    ports: 
      - "8000:8000"

volumes:
  db:
    driver: local
